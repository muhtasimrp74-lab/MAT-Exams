<style>
/* Layout: one calm exam sheet. Question on the left, OMR-style answer grid on the right (stacked on phones). */
:root {
  --bg: #EEF2F4;
  --surface: #FFFFFF;
  --ink: #13222B;
  --muted: #5A6B75;
  --line: #D3DCE1;
  --accent: #0E6E6A;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFED;
  --ok: #1B7F4B;
  --ok-soft: #DDF1E5;
  --bad: #B3372B;
  --bad-soft: #F7E1DE;
  --warn: #8F5B00;
  --warn-soft: #F8EBCF;
  --font-display: "Tiro Bangla", "Noto Serif Bengali", Georgia, serif;
  --font-body: "Hind Siliguri", "Noto Sans Bengali", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1A1F; --surface: #16252C; --ink: #E6EEF1; --muted: #93A5AE; --line: #2B3E47;
    --accent: #4FC3BB; --accent-ink: #08201E; --accent-soft: #1B3A3A;
    --ok: #5CC98B; --ok-soft: #173826; --bad: #F0857A; --bad-soft: #3F1F1C;
    --warn: #E5B25A; --warn-soft: #3A2D12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1A1F; --surface: #16252C; --ink: #E6EEF1; --muted: #93A5AE; --line: #2B3E47;
  --accent: #4FC3BB; --accent-ink: #08201E; --accent-soft: #1B3A3A;
  --ok: #5CC98B; --ok-soft: #173826; --bad: #F0857A; --bad-soft: #3F1F1C;
  --warn: #E5B25A; --warn-soft: #3A2D12; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1040px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.3; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.brand { font-family: var(--font-display); font-size: 18px; }
.brand small { display: block; font-family: var(--font-body); font-size: 13px; color: var(--muted); }
.timer { font-weight: 600; font-size: 20px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.timer.low { color: var(--bad); border-color: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 18px; border-radius: 8px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* start */
.hero { padding: 8px 0 20px; }
.hero h1 { font-size: clamp(28px, 5vw, 42px); }
.hero p { color: var(--muted); max-width: 60ch; margin: 10px 0 0; }
.exam-card { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
.exam-card h2 { font-size: 24px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 15px; margin-top: 8px; }
.rules { margin: 20px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.rules li { padding-left: 22px; position: relative; color: var(--muted); }
.rules li::before { content: ""; position: absolute; left: 0; top: .62em; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); }
.soon { margin-top: 16px; padding: 14px 18px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 15px; }
.nameline { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 20px; }
.nameline input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); min-width: 0; flex: 1 1 200px; }

/* exam */
.exam { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.qhead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; color: var(--muted); font-size: 15px; margin-bottom: 14px; }
.qtext { font-size: 20px; line-height: 1.55; font-weight: 500; margin: 0 0 20px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.opt:hover { border-color: var(--accent); }
.opt .bub { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 600; font-size: 15px; }
.opt .tx { min-width: 0; overflow-wrap: anywhere; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .bub { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; align-items: center; }
.nav .grow { flex: 1; }
.btn.flag[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }

.side { position: sticky; top: 12px; display: grid; gap: 14px; }
.side h3 { font-size: 17px; margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.cell { aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; display: grid; place-items: center; position: relative; padding: 0; }
.cell.ans { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cell.cur { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }
.cell.mk::after { content: ""; position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%; background: var(--warn); border: 2px solid var(--surface); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-top: 14px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); margin-right: 6px; vertical-align: -1px; }
.legend i.a { background: var(--accent); border-color: var(--accent); }
.legend i.m { background: var(--warn); border-color: var(--warn); }
.tally { display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); margin-bottom: 14px; }

.confirm { margin-top: 14px; padding: 14px; border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 10px; display: grid; gap: 10px; }
.confirm .row { display: flex; gap: 10px; flex-wrap: wrap; }

/* result */
.score { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
.big { font-family: var(--font-display); font-size: clamp(48px, 10vw, 76px); line-height: 1; }
.big small { font-size: .38em; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 20px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font-size: 26px; line-height: 1.2; }
.stat span { color: var(--muted); font-size: 14px; }
.stat.ok b { color: var(--ok); } .stat.bad b { color: var(--bad); } .stat.skip b { color: var(--warn); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 26px 0 14px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 16px; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rev { display: grid; gap: 14px; }
.ri { border: 1px solid var(--line); border-radius: 10px; padding: 18px; background: var(--surface); border-left: 6px solid var(--line); }
.ri.ok { border-left-color: var(--ok); } .ri.bad { border-left-color: var(--bad); } .ri.skip { border-left-color: var(--warn); }
.ri .rq { font-weight: 500; font-size: 18px; margin: 4px 0 12px; }
.badge { display: inline-block; font-size: 13px; font-weight: 600; padding: 1px 10px; border-radius: 999px; }
.badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.skip { background: var(--warn-soft); color: var(--warn); }
.ro { display: flex; gap: 12px; align-items: flex-start; padding: 8px 12px; border-radius: 8px; border: 1px solid transparent; }
.ro .bub { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.ro .tx { min-width: 0; overflow-wrap: anywhere; }
.ro.right { background: var(--ok-soft); border-color: var(--ok); } .ro.right .bub { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.ro.wrong { background: var(--bad-soft); border-color: var(--bad); } .ro.wrong .bub { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.ro .tag { margin-left: auto; flex: none; font-size: 13px; font-weight: 600; padding-left: 8px; }
.ro.right .tag { color: var(--ok); } .ro.wrong .tag { color: var(--bad); }
.exp { margin-top: 12px; padding: 12px 14px; background: var(--bg); border-radius: 8px; font-size: 15px; }
.exp b { display: block; margin-bottom: 2px; }
.ref { margin-top: 8px; font-size: 13px; color: var(--muted); }

@media (max-width: 820px) {
  .exam { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  .score { grid-template-columns: 1fr; gap: 8px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .exam-card { grid-template-columns: 1fr; }
  .card { padding: 18px; }
  .grid { grid-template-columns: repeat(5, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .opt, .cell, .btn { transition: background .15s, border-color .15s; }
}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}.opt[disabled]{cursor:default}
.sec{margin:20px 0 4px;font-size:16px;font-weight:600}.hint{color:var(--muted);font-size:14px;margin:0 0 6px}.filters.tight{margin:6px 0 4px}
.tg{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-left:4px}
.foot{margin-top:28px;color:var(--muted);font-size:13px;text-align:center}
</style>
<div class="wrap" id="app"></div>

<script>
(function () {
  var LABELS = ['ক', 'খ', 'গ', 'ঘ'];
  var NEG = 0.25, DURATION = 0;
  var toBn = function (n) { return String(n).replace(/\d/g, function (d) { return '০১২৩৪৫৬৭৮৯'[d]; }); };
  var fmt = function (x) { return toBn((Math.round(x * 100) / 100).toString()); };

  var EXAM = { title: '', subject: '', paper: '', questions: [] };
  var POOL = [], N = 0, PER_Q = 36, CH = [];
  var LS = { get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  var CFG = Object.assign({ ch: null, tp: [], prev: false, cnt: 25, mode: 'exam', pq: 36, neg: true, shuf: true, name: '' }, LS.get('matx.cfg') || {});
  var saveCfg = function () { LS.set('matx.cfg', CFG); };
  window.REG = function (c) { c.questions.forEach(function (q) { q.c = c.id; }); CH.push(c); };
  function shuffle(a) { a = a.slice(); for (var k = a.length - 1; k > 0; k--) { var r = Math.floor(Math.random() * (k + 1)), t = a[k]; a[k] = a[r]; a[r] = t; } return a; }
  function loadAll(cb) {
    var m = window.MANIFEST || [], left = m.length;
    if (!left) return cb();
    m.forEach(function (x) { var el = document.createElement('script'); el.src = x.file + '?v=' + (x.v || 1); el.onload = el.onerror = function () { if (--left === 0) { CH.sort(function (p, q) { return m.findIndex(function (z) { return z.id === p.id; }) - m.findIndex(function (z) { return z.id === q.id; }); }); cb(); } }; document.head.appendChild(el); });
  }
  function chosen() { return CH.filter(function (c) { return CFG.ch.indexOf(c.id) >= 0; }); }
  function topicsOf() { var t = []; chosen().forEach(function (c) { c.questions.forEach(function (q) { if (t.indexOf(q.t) < 0) t.push(q.t); }); }); return t; }
  function avail() { var r = []; chosen().forEach(function (c) { c.questions.forEach(function (q) { if (CFG.tp.length && CFG.tp.indexOf(q.t) < 0) return; if (CFG.prev && !q.p) return; r.push(q); }); }); return r; }
  function normalize() {
    var ids = CH.map(function (c) { return c.id; });
    CFG.ch = (CFG.ch || []).filter(function (i) { return ids.indexOf(i) >= 0; });
    if (!CFG.ch.length && ids.length) CFG.ch = [ids[ids.length - 1]];
    var tp = topicsOf(); CFG.tp = CFG.tp.filter(function (t) { return tp.indexOf(t) >= 0; });
  }
  var NOSHUF = /সবগুলো|সবকটি|উপরের|কোনোটিই|সবই|উভয়|\([ক-ঘ]\)/;
  function prep(q) {
    var idx = q.o.map(function (_, i) { return i; });
    if (CFG.shuf && !q.o.some(function (t) { return NOSHUF.test(t); })) idx = shuffle(idx);
    var c = Object.assign({}, q); c.o = idx.map(function (i) { return q.o[i]; }); c.a = idx.indexOf(q.a); return c;
  }
  var app = document.getElementById('app');
  var S = null, tick = null;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function chip(act, v, label, on) { return '<button class="chip" data-act="' + act + '" data-v="' + esc(v) + '" aria-pressed="' + (!!on) + '">' + label + '</button>'; }
  function showStart() {
    clearInterval(tick); S = null; normalize();
    var A = avail(), n = A.length, k = CFG.cnt ? Math.min(CFG.cnt, n) : n, tps = topicsOf();
    var hasP = chosen().some(function (c) { return c.questions.some(function (q) { return q.p; }); });
    var exam = CFG.mode === 'exam';
    var chH = CH.map(function (c) { return chip('ch', c.id, esc(c.subject + ' ' + c.paper.replace(/\s*·\s*/, ' – ') + ': ' + c.title) + ' (' + toBn(c.questions.length) + ')', CFG.ch.indexOf(c.id) >= 0); }).join('');
    var tpH = chip('tp', '*', 'সব টপিক', !CFG.tp.length) + tps.map(function (t) { return chip('tp', t, esc(t), CFG.tp.indexOf(t) >= 0); }).join('');
    app.innerHTML =
      '<div class="topbar"><div class="brand">মেডিকেল মক টেস্ট<small>যেকোনো সময়, যতবার খুশি অনুশীলন করো</small></div></div>' +
      '<div class="hero"><h1>মেডিকেল ভর্তি প্রস্তুতি</h1><p>অধ্যায় ও টপিক বেছে নাও, পরীক্ষা বা প্র্যাকটিস মোডে প্রশ্ন দাও। শেষে প্রতিটি প্রশ্নের সঠিক উত্তর ও ব্যাখ্যা পাবে।</p></div>' +
      '<div class="card">' +
        '<h3 class="sec" style="margin-top:0">১. অধ্যায় (একাধিক বাছাই করা যায়)</h3><div class="filters tight">' + chH + '</div>' +
        '<h3 class="sec">২. টপিক ফিল্টার</h3><div class="filters tight">' + tpH + '</div>' +
        (hasP ? '<div class="filters tight">' + chip('prev', '1', 'শুধু আগে-আসা (MAT/DAT) প্রশ্ন', CFG.prev) + '</div>' : '') +
        '<h3 class="sec">৩. কয়টি প্রশ্ন?</h3><div class="filters tight">' + [10, 25, 50, 100, 0].map(function (c) { return chip('cnt', c, c ? toBn(c) + 'টি' : 'সব', CFG.cnt === c); }).join('') + '</div>' +
        '<h3 class="sec">৪. মোড</h3><div class="filters tight">' + chip('mode', 'exam', 'পরীক্ষা মোড (সময় + নম্বর কাটা)', exam) + chip('mode', 'practice', 'প্র্যাকটিস মোড (সময়হীন, সাথে সাথে উত্তর)', !exam) + '</div>' +
        '<h3 class="sec">৫. সেটিংস</h3><div class="filters tight">' +
          (exam ? [30, 36, 45, 60].map(function (c) { return chip('pq', c, 'প্রতি প্রশ্নে ' + toBn(c) + ' সেকেন্ড', CFG.pq === c); }).join('') : '') +
          chip('neg', '1', 'ভুলে ' + fmt(0.25) + ' নম্বর কাটা', CFG.neg) + chip('shuf', '1', 'অপশন এলোমেলো', CFG.shuf) + '</div>' +
        '<p class="hint num" style="margin-top:14px">উপলব্ধ প্রশ্ন: ' + toBn(n) + ' · এবার আসবে: ' + toBn(k) + 'টি' + (exam ? ' · সময়: ' + toBn(Math.ceil(k * CFG.pq / 60)) + ' মিনিট' : ' · সময়ের সীমা নেই') + ' · পূর্ণমান: ' + toBn(k) + '</p>' +
        '<div class="nameline"><input id="sname" type="text" placeholder="তোমার নাম (ঐচ্ছিক)" maxlength="60" aria-label="তোমার নাম" value="' + esc(CFG.name || '') + '"><button class="btn primary" data-act="go"' + (n ? '' : ' disabled') + '>' + (exam ? 'পরীক্ষা শুরু করো' : 'অনুশীলন শুরু করো') + '</button></div>' +
      '</div><div class="foot">নতুন অধ্যায় নিয়মিত যোগ হচ্ছে। তোমার সেটিংস এই ডিভাইসে মনে রাখা হয়।</div>';
    document.getElementById('sname').oninput = function () { CFG.name = this.value.trim(); saveCfg(); };
  }
  app.onclick = function (e) {
    var b = e.target.closest('[data-act]'); if (!b || S) return;
    var a = b.getAttribute('data-act'), v = b.getAttribute('data-v');
    var tog = function (arr, x) { var i = arr.indexOf(x); if (i >= 0) arr.splice(i, 1); else arr.push(x); };
    if (a === 'go') { startExam(CFG.name); return; }
    if (a === 'ch') { tog(CFG.ch, v); if (!CFG.ch.length) CFG.ch = [v]; }
    else if (a === 'tp') { if (v === '*') CFG.tp = []; else tog(CFG.tp, v); }
    else if (a === 'prev') CFG.prev = !CFG.prev;
    else if (a === 'cnt') CFG.cnt = +v;
    else if (a === 'mode') CFG.mode = v;
    else if (a === 'pq') CFG.pq = +v;
    else if (a === 'neg') CFG.neg = !CFG.neg;
    else if (a === 'shuf') CFG.shuf = !CFG.shuf;
    saveCfg(); showStart();
  };

  function startExam(name, pool) {
    var src = pool || shuffle(avail());
    if (!pool) src = src.slice(0, CFG.cnt ? Math.min(CFG.cnt, src.length) : src.length);
    var sel = chosen();
    if (sel.length === 1) { EXAM.title = sel[0].title; EXAM.subject = sel[0].subject; EXAM.paper = sel[0].paper; }
    else { EXAM.title = 'মিশ্র অনুশীলন'; EXAM.subject = 'একাধিক অধ্যায়'; EXAM.paper = toBn(sel.length) + 'টি অধ্যায়'; }
    EXAM.questions = src.map(prep); N = EXAM.questions.length;
    NEG = CFG.neg ? 0.25 : 0; PER_Q = CFG.pq; DURATION = N * PER_Q;
    var timed = CFG.mode === 'exam';
    S = { name: name, mode: CFG.mode, timed: timed, cur: 0, ans: new Array(N).fill(-1), mark: new Array(N).fill(false), left: DURATION, used: 0, confirming: false, done: false, filter: 'all' };
    clearInterval(tick);
    tick = setInterval(function () {
      S.used++;
      if (timed) { S.left--; if (S.left <= 0) { S.left = 0; finish(); return; } }
      var t = document.getElementById('timer');
      if (t && timed) { t.textContent = clock(S.left); t.classList.toggle('low', S.left <= 120); }
    }, 1000);
    renderExam();
    window.scrollTo(0, 0);
  }

  function clock(s) {
    var m = Math.floor(s / 60), r = s % 60;
    return toBn(String(m).padStart(2, '0')) + ':' + toBn(String(r).padStart(2, '0'));
  }

  function answered() { return S.ans.filter(function (x) { return x >= 0; }).length; }

  function renderExam() {
    var q = EXAM.questions[S.cur];
    var pr = S.mode === 'practice' && S.ans[S.cur] >= 0;
    var opts = q.o.map(function (t, i) {
      return '<button class="opt' + (pr ? (i === q.a ? ' right' : (i === S.ans[S.cur] ? ' wrong' : '')) : '') + '"' + (pr ? ' disabled' : '') + ' data-i="' + i + '" aria-pressed="' + (S.ans[S.cur] === i) + '"><span class="bub">' + LABELS[i] + '</span><span class="tx">' + esc(t) + '</span></button>';
    }).join('');
    var cells = EXAM.questions.map(function (_, i) {
      var c = 'cell' + (S.ans[i] >= 0 ? ' ans' : '') + (i === S.cur ? ' cur' : '') + (S.mark[i] ? ' mk' : '');
      return '<button class="' + c + '" data-go="' + i + '" aria-label="প্রশ্ন ' + toBn(i + 1) + '">' + toBn(i + 1) + '</button>';
    }).join('');
    var unans = N - answered();
    var confirmBox = S.confirming
      ? '<div class="confirm" role="alert"><div>' + (unans ? toBn(unans) + 'টি প্রশ্নের উত্তর দেওয়া হয়নি। ' : '') + 'পরীক্ষা জমা দিলে আর উত্তর বদলানো যাবে না।</div><div class="row"><button class="btn primary" id="yes">হ্যাঁ, জমা দাও</button><button class="btn" id="no">ফিরে যাই</button></div></div>'
      : '';
    app.innerHTML =
      '<div class="topbar"><div class="brand">' + EXAM.title + '<small>' + EXAM.subject + ' · ' + EXAM.paper + '</small></div>' + (S.timed ? '<div class="timer num' + (S.left <= 120 ? ' low' : '') + '" id="timer" role="timer">' + clock(S.left) + '</div>' : '<div class="timer num">সঠিক: ' + toBn(S.ans.filter(function (x, j) { return x === EXAM.questions[j].a; }).length) + ' / ' + toBn(answered()) + '</div>') + '</div>' +
      '<div class="exam">' +
        '<div class="card">' +
          '<div class="qhead num"><span>প্রশ্ন ' + toBn(S.cur + 1) + ' / ' + toBn(N) + '</span><span>' + (S.ans[S.cur] >= 0 ? 'উত্তর দেওয়া হয়েছে' : 'এখনো উত্তর দাওনি') + '</span></div>' +
          '<p class="qtext">' + esc(q.q) + '</p>' +
          '<div class="opts">' + opts + '</div>' + (pr ? '<div class="exp"><b>' + (S.ans[S.cur] === q.a ? '✔ সঠিক! ' : '✘ ভুল। ') + 'ব্যাখ্যা</b>' + esc(q.e) + '</div>' : '') +
          '<div class="nav">' +
            '<button class="btn" id="prev"' + (S.cur === 0 ? ' disabled' : '') + '>আগের প্রশ্ন</button>' +
            '<button class="btn" id="next"' + (S.cur === N - 1 ? ' disabled' : '') + '>পরের প্রশ্ন</button>' +
            '<span class="grow"></span>' +
            '<button class="btn" id="clear"' + (S.ans[S.cur] < 0 || S.mode === 'practice' ? ' disabled' : '') + '>উত্তর মুছো</button>' +
            '<button class="btn flag" id="flag" aria-pressed="' + S.mark[S.cur] + '">' + (S.mark[S.cur] ? 'চিহ্ন সরাও' : 'পরে দেখব') + '</button>' +
          '</div>' +
        '</div>' +
        '<aside class="side"><div class="card">' +
          '<h3>উত্তরপত্র</h3>' +
          '<div class="tally num"><span>উত্তর দেওয়া: ' + toBn(answered()) + '</span><span>বাকি: ' + toBn(unans) + '</span></div>' +
          '<div class="grid num">' + cells + '</div>' +
          '<div class="legend"><span><i class="a"></i>উত্তর দেওয়া</span><span><i></i>বাকি</span><span><i class="m"></i>পরে দেখব</span></div>' +
          '<div style="margin-top:18px"><button class="btn primary" id="submit" style="width:100%">' + (S.timed ? 'পরীক্ষা জমা দাও' : 'অনুশীলন শেষ করো') + '</button></div>' + confirmBox +
        '</div></aside>' +
      '</div>';

    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function (b) {
      b.onclick = function () { if (S.mode === 'practice' && S.ans[S.cur] >= 0) return; S.ans[S.cur] = +b.getAttribute('data-i'); renderExam(); };
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-go]'), function (b) {
      b.onclick = function () { S.cur = +b.getAttribute('data-go'); S.confirming = false; renderExam(); };
    });
    document.getElementById('prev').onclick = function () { S.cur--; S.confirming = false; renderExam(); };
    document.getElementById('next').onclick = function () { S.cur++; S.confirming = false; renderExam(); };
    document.getElementById('clear').onclick = function () { S.ans[S.cur] = -1; renderExam(); };
    document.getElementById('flag').onclick = function () { S.mark[S.cur] = !S.mark[S.cur]; renderExam(); };
    document.getElementById('submit').onclick = function () { S.confirming = true; renderExam(); };
    if (S.confirming) {
      document.getElementById('yes').onclick = finish;
      document.getElementById('no').onclick = function () { S.confirming = false; renderExam(); };
    }
  }

  function finish() {
    clearInterval(tick);
    S.done = true;
    renderResult();
    window.scrollTo(0, 0);
  }

  function renderResult() {
    var c = 0, w = 0, k = 0;
    EXAM.questions.forEach(function (q, i) {
      if (S.ans[i] < 0) k++; else if (S.ans[i] === q.a) c++; else w++;
    });
    var score = c - w * NEG;
    var tp = {};
    EXAM.questions.forEach(function (q, i) { var o = tp[q.t] || (tp[q.t] = { n: 0, c: 0 }); o.n++; if (S.ans[i] === q.a) o.c++; });
    var tpRows = Object.keys(tp).map(function (k) { var o = tp[k], p = Math.round(o.c / o.n * 100); return '<div class="trow"><span>' + esc(k) + '</span><span class="tbar"><i style="width:' + p + '%"></i></span><span class="num">' + toBn(o.c) + '/' + toBn(o.n) + '</span></div>'; }).join('');
    var acc = (c + w) ? Math.round(c / (c + w) * 100) : 0;
    var used = S.used;
    var items = EXAM.questions.map(function (q, i) {
      var st = S.ans[i] < 0 ? 'skip' : (S.ans[i] === q.a ? 'ok' : 'bad');
      if (S.filter === 'bad' && st !== 'bad') return '';
      if (S.filter === 'skip' && st !== 'skip') return '';
      if (S.filter === 'wrong' && st === 'ok') return '';
      var badge = st === 'ok' ? '<span class="badge ok">সঠিক</span>' : st === 'bad' ? '<span class="badge bad">ভুল</span>' : '<span class="badge skip">উত্তর দাওনি</span>';
      var rows = q.o.map(function (t, j) {
        var cls = j === q.a ? 'right' : (j === S.ans[i] ? 'wrong' : '');
        var tag = j === q.a ? 'সঠিক উত্তর' : (j === S.ans[i] ? 'তোমার উত্তর' : '');
        if (j === q.a && S.ans[i] === j) tag = 'তোমার উত্তর ও সঠিক';
        return '<div class="ro ' + cls + '"><span class="bub">' + LABELS[j] + '</span><span class="tx">' + esc(t) + '</span>' + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</div>';
      }).join('');
      return '<article class="ri ' + st + '"><div class="num" style="color:var(--muted);font-size:14px">প্রশ্ন ' + toBn(i + 1) + ' &nbsp;' + badge + ' &nbsp;<span class="tpc">' + esc(q.t) + '</span></div>' +
        '<p class="rq">' + esc(q.q) + '</p><div style="display:grid;gap:6px">' + rows + '</div>' +
        '<div class="exp"><b>ব্যাখ্যা</b>' + esc(q.e) + '</div>' +
        (q.r.length ? '<div class="ref">সূত্র: ' + q.r.map(esc).join(' · ') + '</div>' : '') + '</article>';
    }).join('');
    if (!items) items = '<div class="soon">এই তালিকায় কোনো প্রশ্ন নেই।</div>';
    function chip(key, label) { return '<button class="chip" data-f="' + key + '" aria-pressed="' + (S.filter === key) + '">' + label + '</button>'; }
    app.innerHTML =
      '<div class="topbar"><div class="brand">ফলাফল<small>' + (S.name ? esc(S.name) + ' · ' : '') + EXAM.title + '</small></div></div>' +
      '<div class="card">' +
        '<div class="score"><div class="big num">' + fmt(score) + '<small> / ' + toBn(N) + '</small></div>' +
        '<div style="color:var(--muted)">' + toBn(c) + 'টি সঠিক থেকে ' + toBn(w) + 'টি ভুলের জন্য ' + fmt(w * NEG) + ' নম্বর কাটা গেছে।<br>সময় লেগেছে ' + clock(used) + ' মিনিট।</div></div>' +
        '<div class="stats num">' +
          '<div class="stat ok"><b>' + toBn(c) + '</b><span>সঠিক</span></div>' +
          '<div class="stat bad"><b>' + toBn(w) + '</b><span>ভুল</span></div>' +
          '<div class="stat skip"><b>' + toBn(k) + '</b><span>উত্তর দাওনি</span></div>' +
          '<div class="stat"><b>' + toBn(acc) + '%</b><span>নির্ভুলতা</span></div>' +
        '</div>' +
        '<h3 style="margin:18px 0 8px;font-size:18px">টপিক অনুযায়ী ফল</h3><div class="topics">' + tpRows + '</div>' +
        '<div class="nameline"><button class="btn primary" id="again">আবার পরীক্ষা দাও</button>' + ((w + k) ? '<button class="btn" id="retry">ভুল ও বাদ দেওয়াগুলো আবার দাও</button>' : '') + '<button class="btn" id="home">শুরুর পাতায় যাও</button></div>' +
      '</div>' +
      '<h2 style="margin-top:32px;font-size:24px">উত্তর ও ব্যাখ্যা</h2>' +
      '<div class="filters">' + chip('all', 'সব (' + toBn(N) + ')') + chip('wrong', 'ভুল ও বাদ (' + toBn(w + k) + ')') + chip('bad', 'শুধু ভুল (' + toBn(w) + ')') + chip('skip', 'বাদ দেওয়া (' + toBn(k) + ')') + '</div>' +
      '<div class="rev">' + items + '</div>';
    Array.prototype.forEach.call(app.querySelectorAll('.chip'), function (b) {
      b.onclick = function () { S.filter = b.getAttribute('data-f'); renderResult(); };
    });
    document.getElementById('again').onclick = function () { startExam(S.name); };
    var rt = document.getElementById('retry');
    if (rt) rt.onclick = function () { var p = EXAM.questions.filter(function (q, i) { return S.ans[i] !== q.a; }); startExam(S.name, p); };
    document.getElementById('home').onclick = showStart;
  }

  loadAll(function () { showStart(); });
})();
</script>

</body></html>
